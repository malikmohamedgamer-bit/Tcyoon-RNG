name: Daily live smoke test

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'Address of the deployed game (default: this repository GitHub Pages site)'
        required: false

permissions:
  contents: read
  issues: write

jobs:
  smoke-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke test the live site
        env:
          LIVE_URL: ${{ inputs.url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: |
          echo "Smoke testing $LIVE_URL"
          npm run smoke:live
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-live-results
          path: test-results
      - name: Open an issue when the live site is broken
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Live site smoke test failed';
            const open = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'smoke-test' });
            if (open.data.some((i) => i.title === title)) return;
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, labels: ['smoke-test'], body: `The daily smoke test of the deployed game failed. See the run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
