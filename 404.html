<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found - Tcyoon RNG</title>
  <meta name="robots" content="noindex">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #14171b; color: #eef1f4; font-family: system-ui, "Segoe UI", sans-serif; text-align: center; padding: 1rem; }
    main { max-width: 28rem; }
    h1 { font-size: 3rem; margin: 0 0 .5rem; color: #ff8a1f; }
    a { display: inline-block; margin-top: 1rem; padding: .8rem 1.4rem; background: #ff8a1f; color: #1a0d00; font-weight: 700; border-radius: 4px; text-decoration: none; min-height: 44px; }
    a:focus-visible { outline: 3px solid #7cc4ff; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>That page does not exist. Your game is safe: saves live in your browser and are not touched by this page.</p>
    <a id="home" href="./">Back to the game</a>
  </main>
  <script>
    // On project pages (user.github.io/repo/...) the game lives in the first path segment; on a custom domain it is the root.
    (function () {
      var seg = location.pathname.split('/')[1];
      var onProject = /\.github\.io$/.test(location.hostname) && seg;
      document.getElementById('home').href = onProject ? '/' + seg + '/' : '/';
    })();
  </script>
</body>
</html>
