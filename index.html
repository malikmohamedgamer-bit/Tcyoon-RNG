<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rollforge Tycoon</title>
  <meta name="description" content="An endless roll-and-place tycoon in 3D pixel art. Roll up an endless rarity ladder, build a production line, defend your base and rebirth.">
  <meta name="theme-color" content="#101418">
  <link rel="icon" href="assets/icons/favicon.ico" sizes="any">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rollforge">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Game Hub">
  <meta property="og:title" content="Rollforge Tycoon">
  <meta property="og:description" content="Roll random items, build a production line on a 3D base, defend it from monsters and rebirth forever. Free, runs in your browser.">
  <meta property="og:image" content="./assets/banner.jpg">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="720">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Rollforge Tycoon">
  <meta name="twitter:description" content="An endless roll-and-place tycoon that runs in your browser. Free.">
  <meta name="twitter:image" content="./assets/banner.jpg">
  <script>
    // If a cached page points at files that no longer exist (a newer version replaced them), reload once with a fresh URL.
    addEventListener('error', function (e) {
      try {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK') && !sessionStorage.getItem('trng-reloaded')) {
          sessionStorage.setItem('trng-reloaded', '1');
          location.replace(location.pathname + '?fresh=' + Date.now());
        }
      } catch (err) { /* storage blocked: nothing to do */ }
    }, true);
  </script>
  <link rel="stylesheet" href="./src/ui/style.css">
  <script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.min.js" } }
  </script>
</head>
<body>
  <a class="skip-link" href="#dock">Skip to game menu</a>
  <div id="app">
    <canvas id="view" tabindex="0" aria-label="3D view of your base. Use the menu to roll items and place them."></canvas>
    <div id="hud" role="region" aria-label="Status"></div>
    <div id="toasts" aria-hidden="true"></div>
    <div id="panels"></div>
    <nav id="dock" aria-label="Game menu"></nav>
    <div id="roll-dock"></div>
    <div id="arena-ui" hidden></div>
    <div id="touch-root"></div>
    <div id="captions" aria-hidden="true"></div>
    <div id="tutorial"></div>
    <div id="tips"></div>
    <div id="undo-root"></div>
    <div id="reveal"></div>
    <div id="update-banner" role="status" hidden></div>
    <div id="modal-root"></div>
  </div>
  <div id="sr-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="sr-alert" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div>
  <noscript>Rollforge Tycoon needs JavaScript and WebGL.</noscript>
  <script type="module" src="./src/main.js"></script>
  <script src="/hub-sdk.js" data-hub-corner="bottom-right" async></script>
</body>
</html>
