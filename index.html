<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tcyoon RNG</title>
  <meta name="description" content="Roll random items, place them on a 3D base, earn money, defend against monsters. Endless.">
  <meta name="theme-color" content="#101418">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='6' fill='%23ff8a1f'/%3E%3Crect x='6' y='6' width='20' height='20' rx='3' fill='%2314171b'/%3E%3Ccircle cx='11' cy='11' r='2.2' fill='%23ff8a1f'/%3E%3Ccircle cx='21' cy='11' r='2.2' fill='%23ff8a1f'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%23ff8a1f'/%3E%3Ccircle cx='11' cy='21' r='2.2' fill='%23ff8a1f'/%3E%3Ccircle cx='21' cy='21' r='2.2' fill='%23ff8a1f'/%3E%3C/svg%3E">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Tcyoon RNG">
  <meta property="og:description" content="Roll random items, build a production line on a 3D base, defend it from monsters and rebirth forever. Free, runs in your browser.">
  <meta property="og:image" content="./assets/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Tcyoon RNG">
  <meta name="twitter:description" content="An endless roll-and-place tycoon that runs in your browser. Free.">
  <meta name="twitter:image" content="./assets/og.png">
  <script>
    // If a cached page points at files that no longer exist (a newer version replaced them), reload once with a fresh URL.
    addEventListener('error', function (e) {
      try {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK') && !sessionStorage.getItem('trng-reloaded')) {
          sessionStorage.setItem('trng-reloaded', '1');
          location.replace(location.pathname + '?fresh=' + Date.now());
        }
      } catch (err) { /* storage blocked: nothing to do */ }
    }, true);
  </script>
  <link rel="stylesheet" href="./src/ui/style.css">
  <script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.min.js" } }
  </script>
</head>
<body>
  <a class="skip-link" href="#dock">Skip to game menu</a>
  <div id="app">
    <canvas id="view" tabindex="0" aria-label="3D view of your base. Use the menu to roll items and place them."></canvas>
    <div id="hud" role="region" aria-label="Status"></div>
    <div id="toasts" aria-hidden="true"></div>
    <div id="panels"></div>
    <nav id="dock" aria-label="Game menu"></nav>
    <div id="roll-dock"></div>
    <div id="arena-ui" hidden></div>
    <div id="touch-root"></div>
    <div id="captions" aria-hidden="true"></div>
    <div id="tutorial"></div>
    <div id="tips"></div>
    <div id="undo-root"></div>
    <div id="reveal"></div>
    <div id="update-banner" role="status" hidden></div>
    <div id="modal-root"></div>
  </div>
  <div id="sr-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="sr-alert" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div>
  <noscript>Tcyoon RNG needs JavaScript and WebGL.</noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
