<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tcyoon RNG</title>
  <meta name="description" content="Roll random items, place them on a 3D base, earn money, defend against monsters. Endless.">
  <meta name="theme-color" content="#101418">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎲%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./src/ui/style.css">
  <script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.min.js" } }
  </script>
</head>
<body>
  <a class="skip-link" href="#dock">Skip to game menu</a>
  <div id="app">
    <canvas id="view" tabindex="0" aria-label="3D view of your base. Use the menu to roll items and place them."></canvas>
    <div id="hud" role="region" aria-label="Status"></div>
    <div id="toasts" aria-hidden="true"></div>
    <div id="panels"></div>
    <nav id="dock" aria-label="Game menu"></nav>
    <div id="arena-ui" hidden></div>
    <div id="touch-root"></div>
    <div id="captions" aria-hidden="true"></div>
    <div id="modal-root"></div>
  </div>
  <div id="sr-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="sr-alert" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div>
  <noscript>Tcyoon RNG needs JavaScript and WebGL.</noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
